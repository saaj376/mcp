[project]
name = "codebase-memory-mcp"
version = "0.1.0"
description = "A persistent, queryable structural knowledge graph of a codebase, exposed over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
codebase-memory-mcp = "codebase_memory.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codebase_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
