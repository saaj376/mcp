# Generated by codebase-memory-mcp (scaffold_ci).
# Edit the CHECKS registry in codebase_memory/governance/checks.py and
# regenerate — hand-edits here will drift from the required status checks.
name: quality-gate

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
      - name: Install ruff
        run: pip install ruff
      - name: Style and correctness lint.
        run: ruff check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
      - name: Install mypy
        run: pip install mypy
      - name: Static type checking.
        run: mypy codebase_memory

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
      - name: Install pytest
        run: pip install pytest
      - name: Unit test suite.
        run: pytest -q

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
      - name: Install build
        run: pip install build
      - name: Full distribution build (sdist + wheel).
        run: python -m build

  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Known CVEs in the dependency tree.
        run: pip-audit --skip-editable --progress-spinner off

  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
      - name: Install bandit
        run: pip install bandit
      - name: Static application security testing.
        run: bandit -q -r codebase_memory --severity-level medium

  graph:
    name: graph
    # Advisory: blast radius is a heuristic. Promote to blocking only
    # after calibrating HIGH_FANIN on real pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
      - name: Fetch base branch
        run: git fetch --no-tags origin ${{ github.base_ref }}
      - name: Structural blast-radius gate from the code graph.
        run: codebase-memory-gate --base origin/${{ github.base_ref }}
